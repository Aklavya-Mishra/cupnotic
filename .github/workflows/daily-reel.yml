name: Daily reel

on:
  schedule:
    # 13:47 UTC = 19:17 IST. GitHub cron often runs late, so the post usually lands 19:20-19:45 IST.
    - cron: "47 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = show next reel | verify = upload but do not publish | post = publish for real"
        type: choice
        options: [dry-run, verify, post]
        default: dry-run

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # scheduled runs have no inputs, so they always post
      MODE: ${{ inputs.mode || 'post' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      - name: Run (${{ env.MODE }})
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v23.0' }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: |
          case "$MODE" in
            dry-run) python scripts/post_instagram.py --dry-run ;;
            verify)  python scripts/post_instagram.py --verify ;;
            post)    python scripts/post_instagram.py ;;
            *) echo "unknown mode $MODE"; exit 1 ;;
          esac

      - name: Record posted reel
        if: ${{ env.MODE == 'post' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "chore: mark reel posted [skip ci]"
          git push
